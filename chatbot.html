<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Eye Disease Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AI Eye Diagnosis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="video-call.html">Live Video</a></li>
                    <li class="nav-item"><a class="nav-link active" href="chatbot.html">Chatbot</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Ask Our AI Assistant</h2>
                        <div class="chat-container">
                            <div id="chatbox" class="chat-messages mb-4">
                                <div class="message bot">
                                    <div class="message-content">
                                        Hello! I'm your AI eye health assistant. How can I help you today?
                                    </div>
                                </div>
                            </div>
                            <div class="chat-input">
                                <form id="chatForm" class="d-flex gap-2">
                                    <input type="text" id="userInput" class="form-control" placeholder="Type your question..." autofocus>
                                    <button type="submit" class="btn btn-primary">
                                        <span class="d-none d-md-inline">Send</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
                                            <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.5.5 0 0 1-.898.03l-2.184-4.369-4.369-2.184a.5.5 0 0 1 .03-.898L14.546.006a.5.5 0 0 1 .54.11zM6.293 12.707l1.414-1.414L3.828 7.414l-1.414 1.414 3.879 3.879z"/>
                                        </svg>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
