<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AI Eye Diagnosis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="video-call.html">Live Video</a></li>
                    <li class="nav-item"><a class="nav-link" href="chatbot.html">Chatbot</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Analysis Results</h2>
                        <div id="results">
                            <div class="text-center mb-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">Loading results...</p>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <a href="upload.html" class="btn btn-outline-primary me-2">Analyze Another Image</a>
                            <a href="video-call.html" class="btn btn-primary">Consult a Doctor</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resultsContainer = document.getElementById('results');
            const results = JSON.parse(localStorage.getItem('analysisResults'));

            if (!results) {
                resultsContainer.innerHTML = `
                    <div class="alert alert-warning">
                        No analysis results found. Please <a href="upload.html">upload an image</a> first.
                    </div>
                `;
                return;
            }

            const confidenceColor = confidence => {
                if (confidence >= 80) return 'success';
                if (confidence >= 60) return 'info';
                if (confidence >= 40) return 'warning';
                return 'danger';
            };

            const mainPrediction = results.class;
            const confidence = results.confidence;
            const allPredictions = results.all_predictions || [];

            let html = `
                <div class="mb-4">
                    <h3 class="h4 mb-3">Primary Detection</h3>
                    <div class="alert alert-${confidenceColor(confidence)} d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h4 class="h5 mb-1">${mainPrediction}</h4>
                            <div class="progress" style="height: 10px;">
                                <div class="progress-bar bg-${confidenceColor(confidence)}" 
                                     role="progressbar" 
                                     style="width: ${confidence}%" 
                                     aria-valuenow="${confidence}" 
                                     aria-valuemin="0" 
                                     aria-valuemax="100">
                                </div>
                            </div>
                            <small class="mt-1 d-block">Confidence: ${confidence.toFixed(1)}%</small>
                        </div>
                    </div>
                </div>
            `;

            if (allPredictions.length > 1) {
                html += `
                    <div class="mb-4">
                        <h3 class="h4 mb-3">All Detections</h3>
                        <div class="list-group">
                            ${allPredictions.map(pred => `
                                <div class="list-group-item">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <strong>${pred.class}</strong>
                                        <span class="badge bg-${confidenceColor(pred.confidence)}">${pred.confidence.toFixed(1)}%</span>
                                    </div>
                                    <div class="progress" style="height: 5px;">
                                        <div class="progress-bar bg-${confidenceColor(pred.confidence)}" 
                                             role="progressbar" 
                                             style="width: ${pred.confidence}%" 
                                             aria-valuenow="${pred.confidence}" 
                                             aria-valuemin="0" 
                                             aria-valuemax="100">
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Add recommendations based on confidence
            html += `
                <div class="mb-4">
                    <h3 class="h4 mb-3">Recommendations</h3>
                    <div class="alert alert-info">
                        ${confidence >= 70 
                            ? `<p><strong>High Confidence Detection:</strong> Based on our AI analysis, we recommend scheduling an appointment with an ophthalmologist for a comprehensive examination of the detected condition.</p>`
                            : `<p><strong>Low Confidence Detection:</strong> While our AI system has detected potential signs, we strongly recommend consulting with an eye care professional for a thorough examination.</p>`
                        }
                        <hr>
                        <p class="mb-0">Remember: AI analysis is a screening tool and should not replace professional medical advice.</p>
                    </div>
                </div>
            `;

            resultsContainer.innerHTML = html;
        });
    </script>
</body>
</html>
