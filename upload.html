<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Retinal Image</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">AI Eye Diagnosis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="upload.html">Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="video-call.html">Live Video</a></li>
                    <li class="nav-item"><a class="nav-link" href="chatbot.html">Chatbot</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Upload Retinal Image</h2>
                        <form id="uploadForm" class="text-center">
                            <div class="upload-area mb-4 p-5 border rounded-3 bg-light">
                                <div id="preview" class="mb-3">
                                    <img id="imagePreview" src="" alt="" style="max-width: 100%; display: none;">
                                </div>
                                <label for="imageUpload" class="btn btn-outline-primary mb-3">
                                    Choose Image
                                </label>
                                <input type="file" id="imageUpload" accept="image/*" required class="d-none">
                                <p class="text-muted small">Supported formats: JPG, PNG, BMP</p>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg px-5" id="analyzeBtn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true" id="loadingSpinner"></span>
                                Analyze Image
                            </button>
                        </form>
                        <div id="resultMessage" class="alert mt-4" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("imageUpload").addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById("imagePreview");
                    preview.src = e.target.result;
                    preview.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const file = document.getElementById("imageUpload").files[0];
            if (!file) {
                showMessage("Please select an image first.", "warning");
                return;
            }

            // Show loading state
            const loadingSpinner = document.getElementById("loadingSpinner");
            const analyzeBtn = document.getElementById("analyzeBtn");
            loadingSpinner.classList.remove("d-none");
            analyzeBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch("http://localhost:5000/predict", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    // Store the results for the results page
                    localStorage.setItem("analysisResults", JSON.stringify(result));
                    showMessage("Analysis complete! Redirecting to results...", "success");
                    setTimeout(() => {
                        window.location.href = "results.html";
                    }, 1500);
                } else {
                    showMessage(result.error || "Analysis failed. Please try again.", "danger");
                }
            } catch (error) {
                showMessage("Error connecting to the server. Please try again.", "danger");
            } finally {
                loadingSpinner.classList.add("d-none");
                analyzeBtn.disabled = false;
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById("resultMessage");
            messageDiv.className = `alert alert-${type} mt-4`;
            messageDiv.textContent = message;
            messageDiv.style.display = "block";
        }
    </script>
</body>
</html>
